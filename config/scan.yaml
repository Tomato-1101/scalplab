# パラメータスキャン設定（RCI インパルス戦略）
#   python -m scalplab.backtest.scan
# grid の各キーはリストで与え、デカルト積を総当たりする。
# 既定値は仮置き。実データ録画後に範囲を絞り込む前提。

date: 2026-07-16          # 対象営業日（JST）
codes: null               # null なら録画済み全銘柄。明示する場合は [JP.7203, JP.6758] のように
min_signals: 20           # トップ表でこの本数未満のパラメータ組は除外
horizon: 60               # 主評価ホライズン秒

grid:
  rci_period: [7, 9, 11]
  slope_window_sec: [20, 30, 45]
  slope_threshold: [10, 15, 20]
  eff_min: [2.0, 3.0, 4.0]
  af_init: [0.02]
  af_step: [0.02]
  af_max: [0.2]
  cooldown_sec: [60]
  atr_period: [14]
  floor: [0.1]
  slippage_ticks: [0]
