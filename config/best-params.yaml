# チャンピオンパラメータ（現時点の最有力。ウォークフォワード検証の対象）
#
# 出自: 実ティックの 4 銘柄 × 36 組グリッド（reports/scan-*）で最良だった組。
#       実測スプレッドを控除した net で評価している。
# 注意: 選定セッション自体の成績はインサンプル。毎晩の新しい録画に対する
#       ウォークフォワード結果（reports/walkforward.csv）だけを実力として扱う。
# 更新規約: より良い組に差し替える時は、必ず「複数セッションのウォークフォワードで
#       上回った」ことを根拠にし、この出自コメントを書き換える。

params:
  rci_period: 9
  slope_window_sec: 20
  slope_threshold: 30.0
  eff_min: 4.0
  prev_diff_min: 25.0
  # RCI 符号ゲート（要件 2026-07-18）。米国チャンピオンのウォークフォワード連続性を守るため
  # 値は 0（無効）のまま据え置く（このゲートを入れると別の探索空間になり過去 WF と非連続になるため）。
  rci_sign_gate: 0
  cooldown_sec: 60
  atr_period: 14
  af_init: 0.02
  af_step: 0.02
  af_max: 0.2
  floor: 0.1
  slippage_ticks: 0

# ウォークフォワードの対象銘柄（録画があるもののみ実行される）
codes: [US.TQQQ, US.SOXS, US.SOXL, US.NVDA]
horizon: 60
