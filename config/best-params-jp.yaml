# チャンピオンパラメータ（日本株・bars1m バー近似版。ウォークフォワード検証の対象）
#
# 出自: 夜間 autotune（学習/検証の分割探索）の OOS で複数セッション連続して旧チャンピオンを
#       上回った組へ差し替えたもの（autotune ハッシュ 93edd5f8）。変更点は 2 つ:
#       ①spike_turn_min 25→15（V 底の戻り確認を浅くして 1 本早く入る）
#       ②σフェード 3.0 を OR 追加（急変逆張りの補完。トゲ順張りが負けやすい高ボラ日の補完を意図）。
#       旧チャンピオン（トゲ単独 深80/戻25・walkforward ハッシュ b78cc5ce）へ
#       戻すには spike_turn_min: 25 / fade_sigma_k: 0 に戻すだけ。
# 注意: この手法は **銘柄依存が強い**。全銘柄一律ではどのパラメータ組でも検証日の中央値がマイナス
#       ＝「効く銘柄が存在する」タイプで、全銘柄平均を実力とみなしてはいけない。銘柄別行を毎日蓄積し、
#       勝ちやすい銘柄リストをアウトオブサンプルで自己更新していく（codes: auto の意図）。
# 注意: 選定に使った 3 日自体はインサンプル寄り。毎日の新録画に対するウォークフォワード
#       （reports/walkforward-jp.csv）だけを実力として扱う。
# 更新規約: より良い組へ差し替える時は、必ず「複数日のアウトオブサンプル（ウォークフォワード）で
#       上回った」ことを根拠にし、この出自コメントを書き換える（米国版 best-params.yaml と同じ規約）。
#
# バー近似の限界: 日本株はティックが取れないため yfinance 1 分足のバー近似（rci_impulse_bar）で回す。
#       intrabar 情報が無いぶん本命ティック版より感度は落ちる。絶対期待値ではなく相対比較として読む。

params:
  rci_period: 9
  # トゲ単独モード: V 底とは両立しない角度・直前差・RCI 符号ゲートは無効（0）。
  slope_threshold: 0
  prev_diff_min: 0
  rci_sign_gate: 0
  # トゲ反転（V 底＝ロング / 逆 V 天井＝ショート）を主トリガーにする。
  spike_depth_min: 80     # 窓内の先行高値→トラフの落差の下限
  spike_turn_min: 15      # トラフからの戻り（当該バー RCI − トラフ）の下限（2026-07-26 25→15）
  spike_window_bars: 10   # トゲ反転の窓（本数）
  eff_min: 0
  # σフェード（急変逆張り・トゲと OR。SAR 非依存）。2026-07-26 追加＝暴落型の日をトゲと補完し合う。
  fade_sigma_k: 3.0
  fade_sigma_window: 60
  af_init: 0.02
  af_step: 0.02
  af_max: 0.2
  atr_period: 14
  cooldown_bars: 30
  floor: 0.1

# codes: auto → その日 bars1m に録画された全 JP 銘柄へ適用する（固定列挙を保守しない）。
# 銘柄別行が毎日蓄積されるので、勝ちやすい銘柄リストはウォークフォワードで自己更新される。
codes: auto
session: jp
cost_bp: 3.0        # 片道概算コスト（bp）。net = gross - cost_bp
eval_bars: [1, 2]   # 評価ホライズン（シグナルバー終値から +1・+2 バー後の終値）
